<script>
/* Redirect legacy WordPress URLs to the new single-page site.
   Maps an old path to a route hash the SPA reads on load; unknown paths → home. */
(function () {
  var path = (location.pathname || '').toLowerCase();
  var map = [
    [/new-customer-form|contact/, 'contact'],
    [/edible-garden-design|edible-garden-maintenance|growing-season|maintenance/, 'how'],
    [/personal-chef|restaurant|community-garden|assisted-living|treatment-center|commercial/, 'commercial'],
    [/home-garden|south-florida-edible-gardens|new-construction|garden-beds|garden-accessories|residential/, 'residential'],
    [/our-team|our-story|about|mission/, 'about'],
    [/blog|the-dirt|category|author|harvest|press|spotlight|page_id/, 'blog']
  ];
  var route = 'home';
  for (var i = 0; i < map.length; i++) { if (map[i][0].test(path)) { route = map[i][1]; break; } }
  location.replace('/' + (route === 'home' ? '' : '#/' + route));
})();
</script>
