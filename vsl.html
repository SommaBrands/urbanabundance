function Reveal({ children, style }) {
  const ref = React.useRef(null);
  const [seen, setSeen] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el || !('IntersectionObserver' in window)) { setSeen(true); return; }
    const io = new IntersectionObserver((e) => { if (e[0].isIntersecting) { setSeen(true); io.disconnect(); } }, { threshold: 0.12 });
    io.observe(el);
    const t = setTimeout(() => setSeen(true), 1200);
    return () => { clearTimeout(t); io.disconnect(); };
  }, []);
  return <div ref={ref} style={{ opacity: seen ? 1 : 0, transform: seen ? 'none' : 'translateY(22px)', transition: 'opacity .7s var(--ease-grow), transform .7s var(--ease-grow)', ...style }}>{children}</div>;
}

// ---- Jobber work-request embed (official snippet, auto-resizing) ----
const JOBBER_CLIENTHUB_ID = 'c319abfc-2bea-46a6-9f0c-2fa719699013-1583819';
const JOBBER_EMBED_CSS = 'https://d3ey4dbjkt2f6s.cloudfront.net/assets/external/work_request_embed.css';
const JOBBER_EMBED_JS = 'https://d3ey4dbjkt2f6s.cloudfront.net/assets/static_link/work_request_embed_snippet.js';
const JOBBER_PUBLIC_URL = 'https://clienthub.getjobber.com/client_hubs/c319abfc-2bea-46a6-9f0c-2fa719699013/public/work_request/new?form_id=1583819';
const JOBBER_FORM_BASE = 'https://clienthub.getjobber.com/client_hubs/c319abfc-2bea-46a6-9f0c-2fa719699013/public/work_request/embedded_work_request_form?form_id=1583819';

// Attribution: the Jobber snippet builds its iframe src from clienthub_id, so params
// added here are not guaranteed to reach the form. We still pass them (harmless if
// ignored) and stash them so the /thanks conversion event carries the real source.
function rememberAttribution() {
  const keep = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'gclid', 'fbclid'];
  try {
    const here = new URLSearchParams(window.location.search);
    const found = {};
    keep.forEach(k => { const v = here.get(k); if (v) found[k] = v; });
    if (Object.keys(found).length) sessionStorage.setItem('ua_attribution', JSON.stringify(found));
  } catch (e) {}
}

function jobberFormUrl() {
  const keep = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'gclid', 'fbclid'];
  const here = new URLSearchParams(window.location.search);
  const out = [];
  keep.forEach(k => { const v = here.get(k); if (v) out.push(encodeURIComponent(k) + '=' + encodeURIComponent(v)); });
  return out.length ? JOBBER_FORM_BASE + '&' + out.join('&') : JOBBER_FORM_BASE;
}

// The official Jobber snippet initializes once per page load, so on client-side
// navigation it will not rebuild its iframe. We run the snippet first (correct
// behavior on a cold load) and, if no iframe appears, insert Jobber's own embedded
// form frame ourselves — the same URL the snippet builds — so the form is always
// there and always submits into Jobber.
const JOBBER_EMBED_FRAME = 'https://clienthub.getjobber.com/hubs/c319abfc-2bea-46a6-9f0c-2fa719699013/public/requests/1583819/embedded_new?source=embedded_inline';

function jobberEmbedFrameUrl() {
  const p = new URLSearchParams();
  p.set('source', 'embedded_inline');
  try {
    p.set('ga_page_location', window.location.href);
    p.set('ga_page_title', document.title);
    if (document.referrer) p.set('ga_page_referrer', document.referrer);
  } catch (e) {}
  return JOBBER_EMBED_FRAME.split('?')[0] + '?' + p.toString();
}

function JobberForm() {
  const host = React.useRef(null);
  const [armed, setArmed] = React.useState(false);
  const [stalled, setStalled] = React.useState(false);

  React.useEffect(() => {
    let done = false;
    const arm = () => { if (!done) { done = true; setArmed(true); } };
    const el = host.current;
    let io = null;
    if (el && 'IntersectionObserver' in window) {
      io = new IntersectionObserver((e) => { if (e[0].isIntersecting) arm(); }, { rootMargin: '600px' });
      io.observe(el);
    }
    const t = setTimeout(arm, 700);
    return () => { clearTimeout(t); if (io) io.disconnect(); };
  }, []);

  React.useEffect(() => {
    if (!armed) return;
    rememberAttribution();
    if (!document.querySelector('link[href="' + JOBBER_EMBED_CSS + '"]')) {
      const link = document.createElement('link');
      link.rel = 'stylesheet'; link.media = 'screen'; link.href = JOBBER_EMBED_CSS;
      document.head.appendChild(link);
    }
    if (!document.getElementById('ua-jobber-embed-css')) {
      const st = document.createElement('style');
      st.id = 'ua-jobber-embed-css';
      // Jobber grows the frame via postMessage from its own origin; if that message is
      // slow or blocked the frame would sit at 40px. This floor keeps it usable.
      st.textContent = '#' + JOBBER_CLIENTHUB_ID + '{min-height:760px!important;height:auto!important;display:block}'
        + '#' + JOBBER_CLIENTHUB_ID + '.jobber-inline-work-request{min-height:760px!important;height:auto!important}'
        + '#' + JOBBER_CLIENTHUB_ID + ' iframe{width:100%!important;min-height:760px!important;border:none;display:block}';
      document.head.appendChild(st);
    }
    const prev = document.querySelector('script[data-jobber-embed]');
    if (prev) prev.remove();
    const sc = document.createElement('script');
    sc.src = JOBBER_EMBED_JS;
    sc.setAttribute('clienthub_id', JOBBER_CLIENTHUB_ID);
    sc.setAttribute('form_url', jobberFormUrl());
    sc.setAttribute('data-jobber-embed', '1');
    document.body.appendChild(sc);

    // Self-heal: if the snippet did not build a frame (re-mount after navigation,
    // blocked script, cached no-op), mount Jobber's embedded form frame directly.
    const check = setTimeout(() => {
      const box = document.getElementById(JOBBER_CLIENTHUB_ID);
      if (box && !box.querySelector('iframe')) {
        const fr = document.createElement('iframe');
        fr.className = 'jobber-work-request';
        fr.title = 'Urban Abundance new customer request form';
        fr.src = jobberEmbedFrameUrl();
        fr.setAttribute('allow', 'clipboard-write');
        box.appendChild(fr);
        setStalled(true);
      }
    }, 2200);
    return () => clearTimeout(check);
  }, [armed]);

  return (
    <div ref={host} style={{ padding: '8px 4px' }}>

//
// Besides reassurance, it fires the lead conversion once. No pixel is installed yet:
// the dataLayer push below happens regardless, and the gtag/fbq calls are skipped
// safely until a tag exists. When you add Google Ads, drop the gtag.js snippet in
// index.html <head> and swap the generic event for:
//   gtag('event','conversion',{ send_to:'AW-XXXXXXXXX/LABEL' });
function fireLeadConversion() {
  if (window.__ua_lead_fired) return;
  window.__ua_lead_fired = true;
  const params = new URLSearchParams(window.location.search);
  let stashed = {};
  try { stashed = JSON.parse(sessionStorage.getItem('ua_attribution') || '{}'); } catch (e) {}
  const at = (k) => params.get(k) || stashed[k] || '';
  const payload = {
    event: 'generate_lead',
    form: 'jobber_work_request',
    utm_source: at('utm_source'),
    utm_medium: at('utm_medium'),
    utm_campaign: at('utm_campaign'),
    gclid: at('gclid'),
    fbclid: at('fbclid'),
  };
  try { (window.dataLayer = window.dataLayer || []).push(payload); } catch (e) {}
  // Google Ads / GA4 — fires only once gtag.js is on the page.
  try { if (typeof window.gtag === 'function') { window.gtag('event', 'generate_lead', payload); } } catch (e) {}
  // Meta
  try { if (typeof window.fbq === 'function') { window.fbq('track', 'Lead'); } } catch (e) {}
}
