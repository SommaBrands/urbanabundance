<script type="text/babel" data-presets="react">
(function () {
const { Ticker, Header, Footer, Home, HowItWorks, Residential, Commercial, About, Contact, Blog } = window;
const PAGES = { home: Home, how: HowItWorks, residential: Residential, commercial: Commercial, about: About, blog: Blog, contact: Contact };
function App() {
  const parseHash = () => { var h = (window.location.hash || ''); if (h.charAt(0) === '#') h = h.slice(1); if (h.charAt(0) === '/') h = h.slice(1); return ['home','how','residential','commercial','about','blog','contact'].indexOf(h) >= 0 ? h : 'home'; };
  const [page, setPage] = React.useState(parseHash);
  const META = {
    home: ['Urban Abundance | Concierge Edible Gardens in South Florida', 'You relax, we grow. Beautiful, productive edible gardens designed, built, and maintained across South Florida. Book a free assessment.'],
    how: ['How It Works | Urban Abundance Edible Gardens', 'Design, installation, and bi-weekly care — the only full-service edible garden program in South Florida. See how we grow with you.'],

    commercial: ['Commercial Gardens | Urban Abundance', 'Farm-to-table gardens for restaurants, community centers, assisted living, and treatment centers across South Florida.'],
    about: ['Our Story | Urban Abundance', 'Everyone grows food. Meet the South Florida company on a mission to make growing your own food beautiful, simple, and possible.'],
    blog: ['The Journal | Urban Abundance Garden Blog', 'Tips, stories, and South Florida growing know-how from the Urban Abundance GreenThumbs.'],
    contact: ['Book a Free Garden Assessment | Urban Abundance', 'Ready to grow? Book your free, no-pressure garden assessment with an Urban Abundance GreenThumb today.'],
  };
  React.useEffect(() => {
    const m = META[page] || META.home;
    document.title = m[0];
    let d = document.querySelector('meta[name="description"]');
    if (d) d.setAttribute('content', m[1]);
  }, [page]);
  const go = (id) => { setPage(id); window.location.hash = id === 'home' ? '#/' : '#/' + id; window.scrollTo({ top: 0, behavior: 'auto' }); };
  React.useEffect(() => { const onHash = () => setPage(parseHash()); window.addEventListener('hashchange', onHash); return () => window.removeEventListener('hashchange', onHash); }, []);
  const Page = PAGES[page] || Home;
  return (
    <React.Fragment>
      <Ticker />
      <Header page={page} go={go} />
      <Page go={go} />
      <Footer go={go} />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
